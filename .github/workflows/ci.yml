# Lint and tests for every pull request to main.
name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request supersedes the run for the previous one.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  test:
    runs-on: ubuntu-latest
    services:
      # Same image and credentials as docker-compose.yml, which .env.example
      # points DATABASE_URL at.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: saman
          POSTGRES_PASSWORD: saman
          POSTGRES_DB: saman_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U saman -d saman_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Creates the .env files, with a PAYLOAD_SECRET generated for this run.
      - run: pnpm setup
      - run: pnpm test

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: saman
          POSTGRES_PASSWORD: saman
          POSTGRES_DB: saman_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U saman -d saman_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm setup
      - run: pnpm --filter cms exec playwright install --with-deps chromium
      # Playwright starts both dev servers itself (webServer in
      # src/cms/playwright.config.ts).
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: src/cms/playwright-report/
          retention-days: 7
