name: saman

services:
  postgres:
    image: postgres:17-alpine
    container_name: saman-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: saman
      POSTGRES_PASSWORD: saman
      POSTGRES_DB: saman_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saman -d saman_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
